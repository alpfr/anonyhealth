steps:
  # Build the Docker image. Vite env vars are pulled from Secret Manager and
  # passed as build args so they are baked into the static bundle (they are
  # publishable values — Supabase URL and anon key — but keeping them out of
  # the repo means they rotate without a commit).
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --platform linux/amd64 \
          --build-arg VITE_SUPABASE_URL="$$VITE_SUPABASE_URL" \
          --build-arg VITE_SUPABASE_ANON_KEY="$$VITE_SUPABASE_ANON_KEY" \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/healthcare-repo/anonyhealth:$BUILD_ID \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/healthcare-repo/anonyhealth:latest \
          .
    secretEnv:
      - VITE_SUPABASE_URL
      - VITE_SUPABASE_ANON_KEY

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/healthcare-repo/anonyhealth'

  # Deploy to Cloud Run (Serverless Scale-to-Zero, 98% Cost Reduction)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'anonyhealth'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/healthcare-repo/anonyhealth:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=250'
      - '--port=8080'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_URL/versions/latest
      env: VITE_SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_ANON_KEY/versions/latest
      env: VITE_SUPABASE_ANON_KEY
    # To enable Sentry, create the secret and uncomment:
    #   gcloud secrets create VITE_SENTRY_DSN --data-file=<(echo -n "https://...@sentry.io/...")
    # - versionName: projects/$PROJECT_ID/secrets/VITE_SENTRY_DSN/versions/latest
    #   env: VITE_SENTRY_DSN

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/healthcare-repo/anonyhealth:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/healthcare-repo/anonyhealth:latest'
