
[functions.create-user]
enabled = true
verify_jwt = true
import_map = "./functions/create-user/deno.json"
entrypoint = "./functions/create-user/index.ts"

[functions.aichat]
enabled = true
verify_jwt = true
entrypoint = "./functions/aichat/index.ts"

