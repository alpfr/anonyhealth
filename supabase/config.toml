
[functions.create-user]
enabled = true
verify_jwt = true
import_map = "./functions/create-user/deno.json"
entrypoint = "./functions/create-user/index.ts"

# Legacy single-agent chat function. Retained for backward compatibility
# while clients migrate to the two-agent intake/triage flow.
[functions.aichat]
enabled = true
verify_jwt = true
entrypoint = "./functions/aichat/index.ts"

# Intake Agent — conversational symptom gathering. The Intake Agent has a
# multi-turn conversation with the patient and signals readiness via a
# "<complete/>" marker when it has enough information.
[functions.intake]
enabled = true
verify_jwt = true
entrypoint = "./functions/intake/index.ts"

# Triage Agent — clinical assessment from the full intake transcript.
# Single-shot: receives the conversation history and produces a structured
# assessment with severity, urgency, and recommended next steps.
[functions.triage]
enabled = true
verify_jwt = true
entrypoint = "./functions/triage/index.ts"

[functions.log-audit]
enabled = true
verify_jwt = true
entrypoint = "./functions/log-audit/index.ts"

[functions.stripe-checkout]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-checkout/index.ts"

# Stripe posts webhooks without a Supabase JWT; authenticity is proven by the
# Stripe-Signature header and verified inside the function.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"

[functions.stripe-portal]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-portal/index.ts"

[functions.create-patient-invite]
enabled = true
verify_jwt = true
entrypoint = "./functions/create-patient-invite/index.ts"

[functions.accept-patient-invite]
enabled = true
verify_jwt = true
entrypoint = "./functions/accept-patient-invite/index.ts"

[functions.export-tenant]
enabled = true
verify_jwt = true
entrypoint = "./functions/export-tenant/index.ts"

[functions.sync-subscription]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-subscription/index.ts"

[functions.send-appointment-email]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-appointment-email/index.ts"
