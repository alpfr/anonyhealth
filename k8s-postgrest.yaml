# Secret `postgrest-secrets` is managed out-of-band (ExternalSecrets / Secret Manager).
# It MUST provide the following keys:
#   PGRST_DB_URI       postgres://authenticator:<password>@127.0.0.1:5432/postgres
#   PGRST_JWT_SECRET   random string >= 32 chars, shared with the auth-proxy
# Never commit these values. Apply via:
#   kubectl create secret generic postgrest-secrets \
#     --from-literal=PGRST_DB_URI=... --from-literal=PGRST_JWT_SECRET=...
# or use ExternalSecrets referencing Google Secret Manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  labels:
    app: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.2.0
        ports:
        - containerPort: 3000
        env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              name: postgrest-secrets
              key: PGRST_DB_URI
        - name: PGRST_DB_SCHEMAS
          value: "public"
        - name: PGRST_DB_ANON_ROLE
          value: "anon"
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: postgrest-secrets
              key: PGRST_JWT_SECRET
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
        args:
          - "--port=5432"
          - "alpfr-splunk-integration:us-central1:anonyhealth-db"
        securityContext:
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: postgrest
