apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: anonyhealth-pdb
  labels:
    app: anonyhealth
spec:
  minAvailable: 1
  # Allow unhealthy pods to be evicted during node drains even if they breach
  # the PDB — prevents stuck-unhealthy pods from blocking cluster maintenance.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: anonyhealth
