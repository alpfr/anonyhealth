name: Deploy to Production

# Triggers:
#   • push to main      — runs tests, then production deploy
#   • workflow_dispatch — manual deploy (also runs tests)
#
# Required secrets (configure in GitHub → Settings → Secrets → Actions):
#   GCP_PROJECT_ID         — e.g. alpfr-splunk-integration
#   GCP_SA_KEY             — JSON key for the deploy service account
#   VITE_SUPABASE_URL      — used at build time during tests
#   VITE_SUPABASE_ANON_KEY — used at build time during tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Gate: run tests before deploying.
  # If tests fail, the deploy job won't run.
  # ──────────────────────────────────────────────
  test:
    name: Lint & Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Build app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Deploy — only runs if `test` job succeeded.
  # ──────────────────────────────────────────────
  deploy:
    name: Build & deploy to GKE
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Submit Cloud Build
        id: build
        run: |
          set -e
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild.yaml \
            --format='value(id)' \
            --quiet)
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Build ID: ${BUILD_ID}"

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials opssightai-cluster \
            --zone us-central1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/anonyhealth --timeout=5m

      - name: Run verification script
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          chmod +x ./scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh

      - name: Annotate run summary
        if: always()
        run: |
          {
            echo "## Deployment Result"
            echo ""
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Build ID**: \`${{ steps.build.outputs.build_id }}\`"
            echo "- **Build logs**: https://console.cloud.google.com/cloud-build/builds/${{ steps.build.outputs.build_id }}?project=${{ secrets.GCP_PROJECT_ID }}"
            echo "- **Production URL**: https://anonyhealth.opssightai.com"
          } >> "$GITHUB_STEP_SUMMARY"
