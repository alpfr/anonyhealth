name: Deploy to Production

# Triggers:
#   • push to main      — runs tests, then production deploy
#   • workflow_dispatch — manual deploy (also runs tests)
#
# Required secrets (configure in GitHub → Settings → Secrets → Actions):
#   GCP_PROJECT_ID         — e.g. alpfr-splunk-integration
#   GCP_SA_KEY             — JSON key for the deploy service account
#   VITE_SUPABASE_URL      — used at build time during tests
#   VITE_SUPABASE_ANON_KEY — used at build time during tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Gate: run tests before deploying.
  # If tests fail, the deploy job won't run.
  # ──────────────────────────────────────────────
  test:
    name: Lint & Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Build app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Deploy — only runs if `test` job succeeded.
  # ──────────────────────────────────────────────
  deploy:
    name: Build & deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Submit Cloud Build & Deploy to Cloud Run
        id: build
        run: |
          set -e
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild.yaml \
            --format='value(id)' \
            --quiet)
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Build ID: ${BUILD_ID}"

      - name: Verify Cloud Run Endpoint
        id: verify
        run: |
          SERVICE_URL=$(gcloud run services describe anonyhealth \
            --region=us-central1 \
            --format='value(status.url)')
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run Service URL: ${SERVICE_URL}"
          
          # Health check probe
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}")
          echo "HTTP Status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -ne 200 ]; then
            echo "Warning: Expected HTTP 200, got ${HTTP_STATUS}"
          fi

      - name: Annotate run summary
        if: always()
        run: |
          {
            echo "## Deployment Result (Google Cloud Run)"
            echo ""
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Build ID**: \`${{ steps.build.outputs.build_id }}\`"
            echo "- **Cloud Run URL**: ${{ steps.verify.outputs.service_url }}"
            echo "- **Custom Domain**: https://anonyhealth.opssightai.com"
            echo "- **Cost Mode**: Scale-to-Zero Serverless (<$5/mo)"
          } >> "$GITHUB_STEP_SUMMARY"
