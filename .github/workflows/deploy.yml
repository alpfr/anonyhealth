name: Deploy to Production

# Triggers:
#   • push to main      — production deploy
#   • workflow_dispatch — manual deploy from the Actions tab
#
# Required secrets (configure in GitHub → Settings → Secrets → Actions):
#   GCP_PROJECT_ID   — e.g. alpfr-splunk-integration
#   GCP_SA_KEY       — JSON key for the deploy service account

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let an in-flight deploy finish before starting another. Avoids half-deployed state.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to GKE
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # Auth to GCP via JSON service account key.
      # To upgrade to Workload Identity Federation later, swap this step.
      # ──────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ──────────────────────────────────────────────
      # Build & deploy via Cloud Build.
      # cloudbuild.yaml drives the full pipeline: Docker build → Artifact
      # Registry push → GKE deployment update.
      # ──────────────────────────────────────────────
      - name: Submit Cloud Build
        id: build
        run: |
          set -e
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild.yaml \
            --format='value(id)' \
            --quiet)
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Build ID: ${BUILD_ID}"
          echo "Logs: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${{ secrets.GCP_PROJECT_ID }}"

      # ──────────────────────────────────────────────
      # Verify the rollout — fetch GKE creds, run verification script.
      # ──────────────────────────────────────────────
      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials opssightai-cluster \
            --zone us-central1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/anonyhealth --timeout=5m

      - name: Run verification script
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          chmod +x ./scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh

      # ──────────────────────────────────────────────
      # Summary line for the run page.
      # ──────────────────────────────────────────────
      - name: Annotate run summary
        if: always()
        run: |
          {
            echo "## Deployment Result"
            echo ""
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Build ID**: \`${{ steps.build.outputs.build_id }}\`"
            echo "- **Build logs**: https://console.cloud.google.com/cloud-build/builds/${{ steps.build.outputs.build_id }}?project=${{ secrets.GCP_PROJECT_ID }}"
            echo "- **Production URL**: https://anonyhealth.opssightai.com"
          } >> "$GITHUB_STEP_SUMMARY"
